[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "text-dialogue-agents"
version = "0.1.0"
description = "Text-based conversational AI models for dialogue understanding, generation, retrieval, tool use, and fine-tuning"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "requests>=2.31",
    "torch>=2.0",
]

[project.optional-dependencies]
experiments = [
    "datasets>=3.0",
    "pandas>=2.0",
    "peft>=0.14",
    "sacrebleu>=2.4",
    "scikit-learn>=1.3",
    "transformers>=4.48",
    "trl>=0.12",
]

[tool.setuptools.packages.find]
where = ["src"]
